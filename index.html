<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>TV Distance Alarm</title></head><body><main id="setup" class="panel"><h1>TV Distance Alarm</h1><p>Point the phone at the viewing area. Stand at the acceptable distance, calibrate, then let the alarm do its job.</p><button id="start">Start camera</button><button id="calibrate" disabled>Calibrate safe distance</button><label>Alarm threshold <strong id="thresholdValue">120%</strong><input id="threshold" type="range" min="105" max="180" value="120"></label><p id="status">Camera not started.</p></main><section id="monitor" hidden><video id="video" autoplay playsinline muted></video><div id="overlay"><div id="state">STARTING…</div><div id="debug">No face detected</div></div><div class="controls"><button id="recalibrate">Recalibrate</button><button id="stop">Stop</button></div></section><script type="module" src="app.js"></script></body></html>
